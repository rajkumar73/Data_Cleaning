<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer glowing spreadsheet / sheet frame -->
  <g filter="url(#glow)">
    <rect x="96" y="96" width="320" height="320" rx="28" fill="#1e293b" stroke="url(#gridGrad)" stroke-width="8"/>
    
    <!-- Table Header Row -->
    <path d="M96 124 C96 108.536 108.536 96 124 96 L388 96 C403.464 96 416 108.536 416 124 L416 160 L96 160 Z" fill="url(#accent)"/>
    
    <!-- Header Divider dots / columns -->
    <rect x="190" y="118" width="20" height="20" rx="4" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="246" y="118" width="60" height="20" rx="4" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="336" y="118" width="50" height="20" rx="4" fill="#ffffff" fill-opacity="0.9"/>

    <!-- Grid Horizontal Lines -->
    <line x1="96" y1="224" x2="416" y2="224" stroke="#334155" stroke-width="4"/>
    <line x1="96" y1="288" x2="416" y2="288" stroke="#334155" stroke-width="4"/>
    <line x1="96" y1="352" x2="416" y2="352" stroke="#334155" stroke-width="4"/>

    <!-- Grid Vertical Lines -->
    <line x1="184" y1="160" x2="184" y2="416" stroke="#334155" stroke-width="4"/>
    <line x1="300" y1="160" x2="300" y2="416" stroke="#334155" stroke-width="4"/>

    <!-- Validated checkmarks / Clean cell highlights -->
    <!-- Cell 1 (Row 1 Col 1): valid check badge -->
    <circle cx="140" cy="192" r="14" fill="#10b981" fill-opacity="0.2"/>
    <path d="M133 192 L138 197 L147 187" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cell 2 (Row 1 Col 2): cleaned text line -->
    <rect x="204" y="186" width="76" height="12" rx="3" fill="#38bdf8"/>

    <!-- Cell 3 (Row 1 Col 3): standardized badge -->
    <rect x="320" y="186" width="64" height="12" rx="3" fill="#818cf8"/>

    <!-- Cell 4 (Row 2 Col 1): checkmark -->
    <circle cx="140" cy="256" r="14" fill="#10b981" fill-opacity="0.2"/>
    <path d="M133 256 L138 261 L147 251" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="204" y="250" width="64" height="12" rx="3" fill="#38bdf8"/>
    <rect x="320" y="250" width="80" height="12" rx="3" fill="#34d399"/>

    <!-- Cell 7 (Row 3 Col 1) -->
    <circle cx="140" cy="320" r="14" fill="#10b981" fill-opacity="0.2"/>
    <path d="M133 320 L138 325 L147 315" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="204" y="314" width="82" height="12" rx="3" fill="#38bdf8"/>
    <rect x="320" y="314" width="56" height="12" rx="3" fill="#38bdf8"/>

    <!-- Sparkle Clean Magic Star in bottom right -->
    <path d="M375 340 L381 356 L397 362 L381 368 L375 384 L369 368 L353 362 L369 356 Z" fill="#38bdf8"/>
    <circle cx="340" cy="380" r="4" fill="#fbbf24"/>
  </g>
</svg>
